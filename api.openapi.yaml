  /api/book/{book-id}/allocate:
    patch:
      summary: Allocate Available Book Copy
      deprecated: false
      description: >-
        Scans the inventory for an available physical copy of the specified
        book. If an available copy exists, its status is immediately changed to
        waiting-approval to prevent concurrent allocation by other member. This
        endpoint is idempotent; sending the same request with the same
        `Idempotency-Key` will safely return the previously allocated copy ID
        without allocating a second physical copy.


        ---


        **Path Parameters**


        | Name | Type | Required | Description |

        | ---- | ---- | -------- | ----------- |

        | book-id | GUID | Yes | The unique identifier of the book (e.g.,
        90870800-9c33-4d42-858b-fa4969fd7455).
         |

        ---


        **Headers**


        | Name | Type | Required | Description |

        | ---- | ---- | -------- | ----------- |

        | Idempotency-Key | string | Yes | A unique, client-generated string
        (such as a V4 UUID) used to recognize subsequent retries of the same
        request. If not provided, the server may reject the request or treat it
        as a standard, non-idempotent operation. |

        | Content-Type | string | Yes | Must be`application/json` |


        ---


        **Responses**


        `200 OK`

        Returns the unique ID of the specific physical `BookCopy` that was
        reserved.

        Content-Type: `application/json`

        ```json

        {
          "BookCopyId": "90870800-9c33-4d42-858b-fa4969fd7455"
        }

        ```


        `400 Bad Request`

        Returned if the allocation process fails.

        Content-Type: `application/json`

        ```json

        {
          "code": "Book.NoAvailableCopies",
          "description": "No available copies."
        }

        ```


        `404 Not Found`

        Returned if no book exists in the catalog matching the provided
        `book-id`.


        `409 Conflict`

        Returned if another user allocated the exact same copy at the exact same
        millisecond.
      tags:
        - book
        - book-copy
        - patch
        - command
      parameters:
        - name: book-id
          in: path
          description: >-
            The unique identifier of the book (e.g.,
            90870800-9c33-4d42-858b-fa4969fd7455).
          required: true
          example: '{{$string.uuid}}'
          schema:
            type: string
        - name: Content-Type
          in: header
          description: Must be application/json
          required: false
          example: application/json
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: >-
            A unique, client-generated string (such as a V4 UUID) used to
            recognize subsequent retries of the same request. If not provided,
            the server may reject the request or treat it as a standard,
            non-idempotent operation.
          required: true
          example: '{{$string.uuid}}'
          schema:
            type: string
      responses:
        '200':
          description: >-
            Returns the unique ID of the specific physical BookCopy that was
            reserved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  BookCopyId:
                    type: string
                    x-apidog-mock: '{{$string.uuid}}'
