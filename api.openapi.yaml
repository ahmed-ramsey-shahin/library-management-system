paths:
  /api/audiences/:
    post:
      summary: Create Audience
      deprecated: false
      description: >-
        Creates a new **audience**.


        This endpoint supports idempotency to ensure that retrying a failed or
        timed-out request does not result in duplicate audience creations. By
        providing a unique idempotency key, subsequent requests with the same
        key and payload will return the original successful response without
        creating a new resource.


        ---


        **Request Headers**

        | Name | Type | Required | Description |

        | ---- | ---- | -------- | ----------- |

        | Idempotency-Key | string | Yes | A unique, client-generated string
        (such as a V4 UUID) used to recognize subsequent retries of the same
        request. If not provided, the server may reject the request or treat it
        as a standard, non-idempotent operation. |

        | Content-Type | string | Yes | Must be`application/json` |


        ---


        **Request Body**


        | Name | Type | Required | Description |

        | ---- | ---- | -------- | ----------- |

        | Name | string | Yes | The display name of the audience (e.g.,
        "adults"). Must be unique within the system.|


        ---


        **Example request payload**


        `{"name": "adults"}`


        ---


        **Responses**


        `201 Created`

        The audience was successfully created, or a previous request with the
        same Idempotency-Key was already successfully processed. The response
        body returns the unique resource `id` of the audience.


        `{"id": "8ac98a8c-1998-4836-9165-00b8c06b4a9c"}`


        `400 Bad request`

        The request was malformed or missing required fields (e.g., the name is
        empty or exceeds character limits).


        `409 Conflict`

        An audience with the provided `name` already exists, OR the
        Idempotency-Key was reused with a different request payload.
      tags:
        - audience
        - command
        - create
      parameters:
        - name: Content-Type
          in: header
          description: Must be`application/json`
          required: false
          example: application/json
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: >-
            A unique, client-generated string (such as a V4 UUID) used to
            recognize subsequent retries of the same request. If not provided,
            the server may reject the request or treat it as a standard,
            non-idempotent operation.
          required: true
          example: '{{$string.uuid}}'
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: >
                    The display name of the audience (e.g., "adults"). Must be
                    unique within the system.
                  x-apidog-mock: '{{$music.genre}}'
              x-apidog-orders:
                - name
              required:
                - name
              x-apidog-ignore-properties: []
            examples: {}
        required: true
      responses:
        '201':
          description: >-
            The audience was successfully created, or a previous request with
            the same Idempotency-Key was already successfully processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique resource `id` of the audience.
                    x-apidog-mock: '{{$string.uuid}}'
                x-apidog-orders:
                  - id
                required:
                  - id
                x-apidog-ignore-properties: []
          headers: {}
          x-apidog-name: Createed
          x-apidog-ordering: 0
        '400':
          description: >-
            The request was malformed or missing required fields (e.g., the name
            is empty or exceeds character limits).
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apidog-ignore-properties: []
                x-apidog-orders: []
          headers: {}
          x-apidog-name: Bad request
          x-apidog-ordering: 1
        '409':
          description: >-
            An audience with the provided `name` already exists, OR the
            Idempotency-Key was reused with a different request payload.
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apidog-ignore-properties: []
                x-apidog-orders: []
          headers: {}
          x-apidog-name: Conflict
          x-apidog-ordering: 2
      security:
        - jwt: []
          x-apidog:
            schemeGroups:
              - id: 30lybBdb_EXAdF6Fh9vyv
                schemeIds:
                  - jwt
            required: false
            use:
              id: 30lybBdb_EXAdF6Fh9vyv
              configs:
                jwt:
                  authConfigs:
                    x-apidog:
                      token: '{{ACCESS_TOKEN}}'
      x-apidog-folder: audiences/commands
      x-apidog-status: developing
      x-apidog-maintainer: Ahmed Shahin
      x-run-in-apidog: https://app.apidog.com/web/project/1282884/apis/api-35217160-run
    get:
      summary: Get All Audiences
      deprecated: false
      description: >-
        This endpoint retrieves a list of all available audiences. It returns a
        lightweight payload containing only the essential identifiers and
        display names, making it ideal for populating dropdown menus, filters,
