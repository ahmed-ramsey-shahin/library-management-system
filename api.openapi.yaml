                "id: "99307cd1-63ee-4d12-aef2-96b6a4bb1aa7",
                "name": "Non-Fiction Productivity"
            },
            {
                "id: "8a4d10de-096d-4438-85ed-44fa72f46f60",
                "name": "Self-Help/Wellness"
            },
            {
                "id: "928b43fe-13fa-47e7-b8c6-cf1b2fbdaa6f",
                "name": "Literary Fiction"
            },
        ]

        ```
      tags:
        - get
        - audience
        - query
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  audiences:
                    type: array
                    items:
                      $ref: '#/components/schemas/AudienceDetails'
                    description: List of audiences
                x-apidog-orders:
                  - audiences
                required:
                  - audiences
                x-apidog-ignore-properties: []
          headers: {}
          x-apidog-name: Success
          x-apidog-ordering: 0
      security: []
      x-apidog-folder: audiences/queries
      x-apidog-status: developing
      x-apidog-maintainer: Ahmed Shahin
      x-run-in-apidog: https://app.apidog.com/web/project/1282884/apis/api-35219585-run
  /api/audiences/{audience-id}:
    delete:
      summary: Delete Audience
      deprecated: false
      description: >-
        Permanently deletes an existing audience.


        ---


        **Path Parameters**


        | Name | Type | Required | Description |

        | ---- | ---- | -------- | ----------- |

        | audience-id | GUID | Yes | The unique identifier of the audience to be
        deleted (e.g., 90870800-9c33-4d42-858b-fa4969fd7455). |


        ---


        **Responses**


        `204 No Content`

        The audience was successfully deleted. No response body is returned.


        `404 Not Found`

        No audience could be found matching the provided `id`.


        `409 Conflict`

        The audience cannot be deleted because it is currently in use (e.g.,
        attached to an active book).
      tags:
