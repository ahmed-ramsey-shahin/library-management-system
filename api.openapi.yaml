        | Name | Type | Required | Description |

        | ---- | ---- | -------- | ----------- |

        | Idempotency-Key | string | Yes | A unique, client-generated string
        (such as a V4 UUID) used to recognize subsequent retries of the same
        request. If not provided, the server may reject the request or treat it
        as a standard, non-idempotent operation. |

        | Content-Type | string | Yes | Must be`application/json` |


        ---


        **Request Body**


        | Name | Type | Required | Description |

        | ---- | ---- | -------- | ----------- |

        | Name | string | Yes | The display name of the theme (e.g., "adults").
        Must be unique within the system.|


        ---


        **Example request payload**


        `{"name": "adults"}`


        ---


        **Responses**


        `201 Created`

        The theme was successfully created, or a previous request with the same
        Idempotency-Key was already successfully processed. The response body
        returns the unique resource `id` of the theme.


        `{"id": "8ac98a8c-1998-4836-9165-00b8c06b4a9c"}`


        `400 Bad request`

        The request was malformed or missing required fields (e.g., the name is
        empty or exceeds character limits).


        `409 Conflict`

        An theme with the provided `name` already exists, OR the Idempotency-Key
        was reused with a different request payload.
