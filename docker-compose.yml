services:
  lms-api:
    image: ahmedramseyshahin/lms-api:latest
    container_name: lms-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=sqlserver;Database=library_management_system;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__RedisConnectionString=redis:6379,abortConnect=false
    depends_on:
      - sqlserver
      - redis
    ports:
      - "8080:8080"
    networks:
      - lms-network
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - lms-network
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms-network

volumes:
  sqlserver_data: {}
  redis_data: {}

networks:
  lms-network:
    driver: bridge
